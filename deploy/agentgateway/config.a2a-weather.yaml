# Optional local A2A example. The backend has no host-published port.
# Adapt issuer to the browser-facing Keycloak URL when using a different port.
config:
  logging:
    format: json
binds:
- port: 4000
  listeners:
  - protocol: HTTP
    policies:
      jwtAuth:
        mode: strict
        issuer: http://localhost:7080/realms/caipe
        audiences: [caipe-platform, agentgateway]
        jwtValidationOptions:
          requiredClaims: [exp, sub, iss, aud]
        jwks:
          url: http://keycloak:7080/realms/caipe/protocol/openid-connect/certs
    routes:
    - name: weather-a2a
      # v1.1.0 native A2A card rewriting expects the legacy `url` field.
      # Proxy HTTP unchanged to preserve the official SDK A2A 1.0 schema.
      backends:
      - host: weather-agent:8121
